<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습 앱 모음</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg: #f4f6f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e1e5eb; --primary: #2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --card: #1d2129; --text: #e6e9ef; --muted: #9aa3b2; --line: #2e3440; --primary: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h1 small { font-size: 14px; font-weight: normal; font-style: italic; color: var(--primary); }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  a.app { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 12px; color: inherit; text-decoration: none; }
  a.app:hover { border-color: var(--primary); }
  a.app .ic { font-size: 34px; }
  a.app b { font-size: 19px; display: block; }
  a.app span { color: var(--muted); font-size: 14px; }
  .copy { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>📚 학습 앱 모음 <small>by Sunny</small></h1>
  <p class="sub">공부할 앱을 골라 주세요.</p>
  <a class="app" href="suneung/"><span class="ic">📘</span><div><b>수능 영어 어휘</b><span>고빈출 400 + 27. 6/9모 + 개념</span></div></a>
  <a class="app" href="vocab/"><span class="ic">📒</span><div><b>국어 어휘 노트</b><span>날짜별 국어 어휘 · 한자 풀이</span></div></a>
  <div class="copy">© 2026 Sunny · 무단 복제·배포 금지</div>
</main>
</body>
</html>
